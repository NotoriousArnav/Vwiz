[project]
name = "vwiz"
version = "0.1.0"
description = "Turn notes and research into narrated animated explainer videos"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Frontend
    "streamlit>=1.65.0",
    # Config / models
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    # Agent orchestration
    "langchain>=1.4.3",
    "langgraph>=1.2.12",
    "langchain-core>=1.6.6",
    "langchain-google-genai>=4.4.0",
    "google-genai>=2.28.0",
    # Voiceover
    "google-cloud-texttospeech>=2.38.0",
    # MCP — mcp must stay <2.0; langchain-mcp-adapters has not widened its cap yet.
    "mcp>=1.24.0,<2.0.0",
    "langchain-mcp-adapters>=0.3.2",
    # Vector store
    "qdrant-client>=1.19.1",
    "langchain-qdrant>=1.1.0",
    # Document ingest
    "pdfplumber>=0.11.10",
    "langchain-text-splitters>=1.1.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
]

[project.scripts]
vwiz = "vwiz.cli:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]