[project]
name = "vwiz"
version = "0.1.0"
description = "Turn notes and research into narrated animated explainer videos"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Frontend
    "streamlit>=1.65.0",
    # Config / models
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    # Agent orchestration
    "langchain>=1.4.3",
    "langgraph>=1.2.12",
    "langchain-core>=1.6.6",
    "langchain-google-genai>=4.4.0",
    "google-genai>=2.28.0",
    "deepagents>=0.7.22",
    # MCP via langchain[mcp] (MCPAdapter + fastmcp). This replaces
    # langchain-mcp-adapters, which capped mcp<2.0 and conflicted with it.
    # Nothing in src/ imported the old adapter.
    "langchain[mcp]>=1.4.3",
    # Voiceover is Gemini TTS via the google-genai SDK, not Cloud TTS.
    # Vector store
    # Document ingest — see src/vwiz/ingest.py for the per-format extractors
    "pdfplumber>=0.11.10",
    "langchain-text-splitters>=1.1.3",
    "markdown>=3.7",
    "python-docx>=1.1",
    "odfpy>=1.4",
    "beautifulsoup4>=4.12",
    "defusedxml>=0.7",
    "langchain-google-community[texttospeech]>=5.1.1",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
]

[project.scripts]
vwiz = "vwiz.cli:main"
vwiz-probe = "vwiz.probe.cli:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
